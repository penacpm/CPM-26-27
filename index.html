<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peña CPM</title>
<style>
:root{
  --bg:#F7F7F5; --surface:#FFFFFF; --surface-alt:#F0EFEA;
  --border:#E1E0D9; --border-strong:#C3C2B7;
  --text:#0B0B0B; --text-secondary:#52514E; --text-muted:#898781;
  --accent:#2a78d6; --accent-bg:#E6F1FB;
  --success:#0f7a54; --success-bg:#E1F5EE;
  --danger:#c73737; --danger-bg:#FCEBEB;
  --warning:#5c3a00; --warning-bg:#f0a825;
  --radius:8px;
}
[data-theme="dark"]{
  --bg:#141413; --surface:#212120; --surface-alt:#282826;
  --border:#3a3a37; --border-strong:#4a4a46;
  --text:#F0EFEC; --text-secondary:#C3C2B7; --text-muted:#898781;
  --accent:#5b9fe8; --accent-bg:#0C447C55;
  --success:#5DCAA5; --success-bg:#0b3f32;
  --danger:#F09595; --danger-bg:#501313;
  --warning:#1a1206; --warning-bg:#f5a623;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;padding-bottom:40px;}
h1,h2,h3{font-weight:500;margin:0;}
a{color:var(--accent);}
button{font-family:inherit;cursor:pointer;}
select,input[type=number],input[type=text],input[type=email],input[type=password],input[type=date]{
  font-family:inherit;font-size:13px;padding:8px 10px;border-radius:var(--radius);
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.btn{padding:10px 16px;border-radius:var(--radius);border:1px solid var(--border-strong);background:transparent;color:var(--text);font-size:13px;}
.btn:hover{background:var(--surface-alt);}
.btn-primary{background:var(--accent);color:#fff;border:none;}
.btn-danger{background:var(--danger);color:#fff;border:none;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;}
[data-theme="dark"] .card{box-shadow:0 1px 3px rgba(0,0,0,.35);}
.tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;display:inline-block;}
.tag-success{background:var(--success-bg);color:var(--success);}
.tag-danger{background:var(--danger-bg);color:var(--danger);}
.tag-warning{background:var(--warning-bg);color:var(--warning);}
.tag-muted{background:var(--surface-alt);color:var(--text-muted);}
.tag-accent{background:var(--accent-bg);color:var(--accent);}
.container{max-width:900px;margin:0 auto;padding:0 8px;}
header{display:flex;align-items:center;justify-content:space-between;padding:14px;border-bottom:1px solid var(--border);}
.logo-box{display:flex;align-items:center;gap:10px;}
.logo-icon{width:38px;height:38px;border-radius:var(--radius);background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;}
#main-nav{display:flex;gap:4px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:50;}
.nav-btn{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--radius);border:none;background:transparent;color:var(--text-secondary);font-size:13px;white-space:nowrap;}
.nav-btn.active{background:var(--accent-bg);color:var(--accent);}
main{padding:16px 0;}
.tab-content{display:none;}
.tab-content.active{display:block;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
@media(max-width:640px){.grid-3{grid-template-columns:1fr 1fr;}}
@media(max-width:420px){.grid-3{grid-template-columns:1fr;}}
.row-between{display:flex;align-items:center;justify-content:space-between;}
.muted{color:var(--text-muted);}
.secondary{color:var(--text-secondary);}
.center{text-align:center;}
.scrollx{overflow-x:auto;}
.metric{background:var(--surface-alt);border-radius:var(--radius);padding:10px;text-align:center;}
.metric .v{font-size:17px;font-weight:500;}
.metric .l{font-size:11px;color:var(--text-muted);margin-top:2px;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-alt);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0;}
.badge-medal{font-size:18px;}
.circle{width:19px;height:19px;border-radius:50%;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.month-header{font-size:13px;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;margin:18px 0 10px;}
.jornada-card{border:1px solid var(--border);border-radius:12px;padding:10px 8px;}
.jornada-card.proximo{border:2px solid var(--accent);background:var(--accent-bg);}
.jornada-card.sinjugar{opacity:.65;}
.team-col{display:flex;flex-direction:column;gap:5px;}
.player-line{display:flex;align-items:center;gap:6px;font-size:12.5px;}
.player-line .pname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.player-line .ptags{margin-left:auto;display:flex;gap:3px;flex-shrink:0;}
.divider-v{width:1px;background:var(--border-strong);}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;justify-content:center;align-items:center;}
.modal-overlay.active{display:flex;}
.modal-box{background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;padding:22px;width:90%;max-width:380px;max-height:85vh;overflow-y:auto;}
#login-error{color:var(--danger);font-size:12px;min-height:1em;margin:4px 0;}
.sub-nav{display:flex;gap:4px;overflow-x:auto;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:6px;}
.sub-nav-btn{flex-shrink:0;padding:6px 10px;border:none;background:transparent;color:var(--text-secondary);font-size:12.5px;border-radius:var(--radius);white-space:nowrap;}
.sub-nav-btn.active{background:var(--surface-alt);color:var(--text);font-weight:500;}
.priv-panel{display:none;}
.priv-panel.active{display:block;}
.result-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:640px){.result-form-grid{grid-template-columns:1fr;}}
.result-row{display:flex;gap:6px;align-items:center;}
.result-row select{flex:2;min-width:0;}
.result-row input{width:30px;text-align:center;padding:8px 2px;}
.result-row input.euro{width:38px;}
.result-col-headers{display:flex;gap:6px;padding:0 0 4px;}
.result-col-headers span{width:30px;text-align:center;font-size:10px;color:var(--text-muted);}
.result-col-headers span.euro{width:38px;}
.formfield{margin-bottom:12px;}
.formfield label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:4px;}
.formfield input,.formfield select{width:100%;}
table.simple{width:100%;border-collapse:collapse;font-size:12.5px;}
table.simple th{text-align:left;color:var(--text-muted);font-weight:500;font-size:11px;padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
table.simple td{padding:6px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
</style>
</head>

<!-- ============== FIREBASE (auth + firestore) ============== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, addDoc }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCeZwHVYZaln4COduMAv1U8_kseCMjjdhY",
  authDomain: "cpm-25-26.firebaseapp.com",
  projectId: "cpm-25-26",
  storageBucket: "cpm-25-26.firebasestorage.app",
  messagingSenderId: "820133355657",
  appId: "1:820133355657:web:67989de005fa1f1f4b6658"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.adminAutenticado = false;
window.loginAdminFirebase = async (email, password) => {
  try { await signInWithEmailAndPassword(auth, email, password); return {ok:true}; }
  catch(e){ return {ok:false, error:"Email o contraseña incorrectos."}; }
};
window.logoutAdminFirebase = () => signOut(auth);
onAuthStateChanged(auth, (user) => {
  window.adminAutenticado = !!user;
  if (typeof window.onCambioSesionAdmin === "function") window.onCambioSesionAdmin(!!user);
});

const jugadoresCol = collection(db, "jugadores");
const jornadasCol = collection(db, "jornadas");
const contabilidadCol = collection(db, "contabilidad");
const historicoCol = collection(db, "historico_temporadas");

window.dbAgregarJugador = (nombre, categoria) => setDoc(doc(jugadoresCol, nombre), {nombre, categoria});
window.dbRenombrarJugador = async (actual, nuevo, categoria) => {
  await setDoc(doc(jugadoresCol, nuevo), {nombre: nuevo, categoria});
  if (actual !== nuevo) await deleteDoc(doc(jugadoresCol, actual));
};
window.dbGuardarJornada = (numero, data) => setDoc(doc(jornadasCol, String(numero)), data);
window.dbGuardarMovimientoContabilidad = (idExplicito, data) => {
  if (idExplicito) return setDoc(doc(contabilidadCol, idExplicito), data);
  return addDoc(contabilidadCol, data);
};
window.dbBorrarMovimientoContabilidad = (id) => deleteDoc(doc(contabilidadCol, id));
const idDoc = (t) => t.replace(/\//g, '-');
window.dbGuardarHistorico = (temporada, data) => setDoc(doc(historicoCol, idDoc(temporada)), data);
window.dbBorrarHistorico = (temporada) => deleteDoc(doc(historicoCol, idDoc(temporada)));

onSnapshot(jugadoresCol, (snap) => {
  const lista = [];
  snap.forEach(d => lista.push(d.data()));
  window.JUGADORES = lista;
  window.onDatosActualizados && window.onDatosActualizados();
});
onSnapshot(jornadasCol, (snap) => {
  const obj = {};
  snap.forEach(d => obj[d.id] = d.data());
  window.JORNADAS_DB = obj;
  window.onDatosActualizados && window.onDatosActualizados();
});
onSnapshot(contabilidadCol, (snap) => {
  const lista = [];
  snap.forEach(d => lista.push({id:d.id, ...d.data()}));
  window.CONTABILIDAD = lista;
  window.onDatosActualizados && window.onDatosActualizados();
});
onSnapshot(historicoCol, (snap) => {
  const lista = [];
  snap.forEach(d => lista.push({id:d.id, ...d.data()}));
  window.HISTORICO = lista;
  window.onDatosActualizados && window.onDatosActualizados();
});
</script>

<script>
/* ============== ESTADO Y CONSTANTES ============== */
window.JUGADORES = window.JUGADORES || [];
window.JORNADAS_DB = window.JORNADAS_DB || {};
window.CONTABILIDAD = window.CONTABILIDAD || [];
window.HISTORICO = window.HISTORICO || [];

const CALENDARIO = (() => {
  const meses = [
    ["Septiembre",2026,8,[2,9,16,23,30]],
    ["Octubre",2026,9,[7,14,21,28]],
    ["Noviembre",2026,10,[4,11,18,25]],
    ["Diciembre",2026,11,[2,9,16]],
    ["Enero",2027,0,[13,20,27]],
    ["Febrero",2027,1,[3,10,17,24]],
    ["Marzo",2027,2,[3,10,17,31]],
    ["Abril",2027,3,[7,14,21,28]],
    ["Mayo",2027,4,[5,12,19]]
  ];
  let n = 1; const arr = [];
  meses.forEach(([nombreMes,anio,mesIdx,dias]) => {
    dias.forEach(dia => { arr.push({numero:n, fecha:new Date(anio,mesIdx,dia), mes:nombreMes}); n++; });
  });
  return arr;
})();
window.CALENDARIO = CALENDARIO;

function fmtFecha(d, conDia){
  const opciones = conDia ? {weekday:'long', day:'numeric', month:'long'} : {day:'numeric', month:'short'};
  return d.toLocaleDateString('es-ES', opciones);
}
function euros(n){ return (Math.round(n*100)/100).toLocaleString('es-ES') + ' €'; }
function dec2(n){ return (Math.round(n*100)/100).toLocaleString('es-ES'); }

function categoriaJugador(nombre){
  const j = window.JUGADORES.find(j => j.nombre === nombre);
  return j ? j.categoria : 'miembro';
}
function esSustituto(nombre){ return categoriaJugador(nombre) === 'sustituto'; }
window.categoriaJugador = categoriaJugador;
window.esSustituto = esSustituto;

/* ============== MOTOR DE ESTADÍSTICAS ============== */
function calcularMarcador(jd){
  const golesBlanco = jd.blanco.reduce((s,j)=>s+(+j.goles||0),0) + jd.negro.reduce((s,j)=>s+(+j.autogoles||0),0);
  const golesNegro = jd.negro.reduce((s,j)=>s+(+j.goles||0),0) + jd.blanco.reduce((s,j)=>s+(+j.autogoles||0),0);
  return {golesBlanco, golesNegro};
}
window.calcularMarcador = calcularMarcador;
function estadoEquipo(golesPropio, golesRival){
  if (golesPropio > golesRival) return 'V';
  if (golesPropio < golesRival) return 'D';
  return 'E';
}

function historialJugador(nombre){
  return CALENDARIO.map(c => {
    const jd = window.JORNADAS_DB[c.numero];
    if (!jd || !jd.jugado) return {numero:c.numero, fecha:c.fecha, jugado:false};
    const {golesBlanco, golesNegro} = calcularMarcador(jd);
    let equipo = null, datos = null;
    const enBlanco = jd.blanco.find(j=>j.nombre===nombre);
    const enNegro = jd.negro.find(j=>j.nombre===nombre);
    if (enBlanco){ equipo='blanco'; datos=enBlanco; }
    else if (enNegro){ equipo='negro'; datos=enNegro; }
    if (!equipo) return {numero:c.numero, fecha:c.fecha, jugado:false};
    const golesFavor = equipo==='blanco'?golesBlanco:golesNegro;
    const golesContra = equipo==='blanco'?golesNegro:golesBlanco;
    const estado = estadoEquipo(golesFavor, golesContra);
    return {
      numero:c.numero, fecha:c.fecha, jugado:true, equipo, estado,
      golesFavor, golesContra, goles:+datos.goles||0, autogoles:+datos.autogoles||0
    };
  });
}
window.historialJugador = historialJugador;

function statsJugador(nombre){
  const histCompleto = historialJugador(nombre);
  const jugadas = histCompleto.filter(h=>h.jugado);
  const pj = jugadas.length;
  const pg = jugadas.filter(h=>h.estado==='V').length;
  const pe = jugadas.filter(h=>h.estado==='E').length;
  const pp = jugadas.filter(h=>h.estado==='D').length;
  const gf = jugadas.reduce((s,h)=>s+h.goles,0);
  const autog = jugadas.reduce((s,h)=>s+h.autogoles,0);
  const pv = pj ? (pg/pj*100) : 0;
  const gxp = pj ? (gf/pj) : 0;
  const ptos = pg*3 + pe*1;
  return {nombre, pj, pg, pe, pp, gf, autog, pv, gxp, ptos, hist: histCompleto};
}
window.statsJugador = statsJugador;

function jugadoresConPartidos(){
  return window.JUGADORES.map(j=>statsJugador(j.nombre)).filter(s=>s.pj>=1);
}
window.jugadoresConPartidos = jugadoresConPartidos;

function calcularRachasJugador(nombre){
  const hist = historialJugador(nombre).filter(h=>h.jugado);
  const tipos = {
    ganados: h=>h.estado==='V',
    perdidos: h=>h.estado==='D',
    sinPerder: h=>h.estado==='V'||h.estado==='E',
    anotando: h=>h.goles>0,
    sinGanar: h=>h.estado==='D'||h.estado==='E',
    sinAnotar: h=>h.goles===0
  };
  const resultado = {};
  Object.keys(tipos).forEach(tipo=>{
    const cond = tipos[tipo];
    let record=0, corriendo=0;
    hist.forEach(h=>{ if (cond(h)){ corriendo++; if (corriendo>record) record=corriendo; } else corriendo=0; });
    let actual=0;
    for (let i=hist.length-1;i>=0;i--){ if (cond(hist[i])) actual++; else break; }
    resultado[tipo] = {actual, record};
  });
  return resultado;
}
window.calcularRachasJugador = calcularRachasJugador;

function rachasEquipo(){
  const tipos = ['ganados','perdidos','sinPerder','anotando','sinGanar','sinAnotar'];
  const out = {};
  tipos.forEach(t=>{ out[t] = {actual:{valor:0,jugadores:[]}, record:{valor:0,jugadores:[]}}; });
  window.JUGADORES.forEach(j=>{
    const r = calcularRachasJugador(j.nombre);
    tipos.forEach(t=>{
      ['actual','record'].forEach(k=>{
        const v = r[t][k];
        if (v>0){
          if (v > out[t][k].valor){ out[t][k] = {valor:v, jugadores:[j.nombre]}; }
          else if (v === out[t][k].valor){ out[t][k].jugadores.push(j.nombre); }
        }
      });
    });
  });
  return out;
}
window.rachasEquipo = rachasEquipo;

function blancoVsNegroHistorico(){
  let b=0,n=0,e=0;
  Object.values(window.JORNADAS_DB).forEach(jd=>{
    if (!jd.jugado) return;
    const {golesBlanco, golesNegro} = calcularMarcador(jd);
    if (golesBlanco>golesNegro) b++; else if (golesNegro>golesBlanco) n++; else e++;
  });
  return {b,n,e,total:b+n+e};
}
window.blancoVsNegroHistorico = blancoVsNegroHistorico;

function proximaJornada(){
  return CALENDARIO.find(c => !(window.JORNADAS_DB[c.numero] && window.JORNADAS_DB[c.numero].jugado)) || null;
}
window.proximaJornada = proximaJornada;

/* ============== NAVEGACIÓN ============== */
function showTab(id, btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('#main-nav .nav-btn').forEach(b=>b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderTab(id);
}
window.showTab = showTab;

function renderTab(id){
  const map = {
    inicio: ()=>window.renderInicio(), calendario: ()=>window.renderCalendario(),
    calendario2: ()=>window.renderCalendario2(),
    clasificacion: ()=>window.renderClasificacion(), pichichi: ()=>window.renderPichichi(),
    rachas: ()=>window.renderRachas(), ficha: ()=>window.renderFicha(),
    comparar: ()=>window.renderComparar(), contabilidad: ()=>window.renderContabilidad(),
    historico: ()=>window.renderHistorico(), privado: ()=>window.renderPrivado()
  };
  if (map[id]){
    try {
      map[id]();
    } catch (err) {
      console.error('Error al renderizar "'+id+'":', err);
      const el = document.getElementById(id);
      if (el) el.innerHTML = '<div class="card"><p style="color:var(--danger);font-weight:500;margin:0 0 6px;">⚠️ Ha ocurrido un error al cargar esta sección</p><p class="muted" style="font-size:12px;margin:0;">'+(err && err.message ? err.message : err)+'</p></div>';
    }
  }
}
window.renderTab = renderTab;
function renderTodo(){
  ['inicio','calendario','calendario2','clasificacion','pichichi','rachas','ficha','comparar','contabilidad','historico','privado'].forEach(id=>{
    const el = document.getElementById(id);
    if (el && el.classList.contains('active')) renderTab(id);
  });
}
window.onDatosActualizados = renderTodo;

function toggleTheme(){
  const html = document.documentElement;
  const actual = html.getAttribute('data-theme');
  const nuevo = actual==='dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', nuevo);
  localStorage.setItem('cpm-theme', nuevo);
}
window.toggleTheme = toggleTheme;
(function(){
  const guardado = localStorage.getItem('cpm-theme');
  const prefiereOscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', guardado || (prefiereOscuro?'dark':'light'));
})();

/* ============== LOGIN ============== */
let ultimoBotonPrivado = null;
function accederPrivado(btn){
  ultimoBotonPrivado = btn;
  if (window.adminAutenticado){ showTab('privado', btn); return; }
  abrirModalLogin();
}
window.accederPrivado = accederPrivado;
function abrirModalLogin(){
  document.getElementById('login-error').innerText='';
  document.getElementById('login-email').value='';
  document.getElementById('login-password').value='';
  document.getElementById('login-modal').classList.add('active');
}
window.cerrarModalLogin = function(){ document.getElementById('login-modal').classList.remove('active'); };
window.enviarLogin = async function(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  if (!email || !password){ err.innerText='Introduce email y contraseña.'; return; }
  err.innerText='Comprobando...';
  const r = await window.loginAdminFirebase(email, password);
  if (r.ok){ window.cerrarModalLogin(); showTab('privado', ultimoBotonPrivado); }
  else err.innerText = r.error;
};
window.onCambioSesionAdmin = function(haySesion){
  if (!haySesion){
    const priv = document.getElementById('privado');
    if (priv && priv.classList.contains('active')) showTab('inicio', document.querySelector('#main-nav .nav-btn'));
  } else if (document.getElementById('privado').classList.contains('active')) { window.renderPrivado(); }
};
function cerrarSesionAdmin(){ window.logoutAdminFirebase(); }
window.cerrarSesionAdmin = cerrarSesionAdmin;

/* Contador en vivo para la sección Calendario */
setInterval(()=>{
  if (document.getElementById('calendario').classList.contains('active')) window.actualizarCuentaAtras && window.actualizarCuentaAtras('ca');
  if (document.getElementById('calendario2').classList.contains('active')) window.actualizarCuentaAtras && window.actualizarCuentaAtras('c2');
  if (document.getElementById('inicio').classList.contains('active')) window.actualizarCuentaAtras && window.actualizarCuentaAtras('ic');
}, 1000);
</script>
